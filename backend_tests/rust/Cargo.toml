[package]
name = "orchestrata-backend-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[features]
openapi = ["orchestrata-solver/openapi"]

[dev-dependencies]
orchestrata-solver = { path = "../../crates/solver" }
orchestrata-ffi = { path = "../../crates/ffi" }
serde_json = "1"

[[test]]
name = "abi"
path = "ffi/abi.rs"

[[test]]
name = "incremental"
path = "solver/incremental.rs"

[[test]]
name = "local_search"
path = "solver/local_search.rs"

[[test]]
name = "reliability"
path = "solver/reliability.rs"

[[test]]
name = "routing"
path = "solver/routing.rs"

[[test]]
name = "solution_comparison"
path = "solver/solution_comparison.rs"

[[test]]
name = "solver"
path = "solver/unit.rs"

[[test]]
name = "count_value"
path = "solver/count_value.rs"

[[test]]
name = "resource_capacity"
path = "solver/resource_capacity.rs"

[[test]]
name = "precedence"
path = "solver/precedence.rs"

[[test]]
name = "no_overlap"
path = "solver/no_overlap.rs"

[[test]]
name = "route_construction"
path = "solver/route_construction.rs"
