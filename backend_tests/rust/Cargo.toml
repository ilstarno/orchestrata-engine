[package]
name = "orchestrata-backend-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[features]
openapi = ["orchestrata-solver/openapi"]

[dev-dependencies]
orchestrata-solver = { path = "../../backend/crates/solver" }
orchestrata-ffi = { path = "../../backend/crates/ffi" }
serde_json = "1"

[[test]]
name = "abi"
path = "ffi/abi.rs"

[[test]]
name = "incremental"
path = "solver/incremental.rs"

[[test]]
name = "local_search"
path = "solver/local_search.rs"

[[test]]
name = "reliability"
path = "solver/reliability.rs"

[[test]]
name = "routing"
path = "solver/routing.rs"

[[test]]
name = "solution_comparison"
path = "solver/solution_comparison.rs"

[[test]]
name = "solver"
path = "solver/unit.rs"
