[package]
name = "orchestrata-browser-demo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
orchestrata-ffi = { path = "../../crates/ffi" }
orchestrata-solver = { path = "../../crates/solver" }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[workspace]
