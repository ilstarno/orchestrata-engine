[package]
name = "orchestrata-recipes"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
orchestrata-recipe-runtime = { path = "../recipe-runtime" }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[[test]]
name = "fleet_benchmark"
path = "tests/fleet_benchmark.rs"

[[test]]
name = "loader"
path = "tests/loader.rs"

[[test]]
name = "payload"
path = "tests/payload.rs"

[[test]]
name = "assignment"
path = "tests/assignment.rs"
